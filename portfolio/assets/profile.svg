<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fba86c" />
    </linearGradient>
    <linearGradient id="clothGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" fill="url(#bgGrad)" />

  <!-- Geometric / Tech grid lines in background -->
  <circle cx="200" cy="200" r="175" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6 6" fill="none" opacity="0.6" />
  <circle cx="200" cy="200" r="145" stroke="#334155" stroke-width="1" fill="none" opacity="0.4" />
  
  <!-- Outer glowing accent ring -->
  <circle cx="200" cy="200" r="185" stroke="url(#accentGrad)" stroke-width="3" fill="none" opacity="0.85" filter="url(#glow)" />

  <!-- Avatar Character Group -->
  <g transform="translate(0, 20)">
    <!-- Shoulders & Hoodie / Jacket -->
    <path d="M 100 360 C 100 290, 140 260, 200 260 C 260 260, 300 290, 300 360 Z" fill="url(#clothGrad)" />
    <!-- Collar & Zip Accent -->
    <path d="M 185 260 L 200 300 L 215 260 Z" fill="#0f172a" />
    <line x1="200" y1="300" x2="200" y2="360" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" />

    <!-- Neck -->
    <path d="M 180 220 L 180 265 C 180 275, 220 275, 220 265 L 220 220 Z" fill="#fba86c" />
    <path d="M 180 238 C 190 248, 210 248, 220 238 L 220 250 C 210 258, 190 258, 180 250 Z" fill="#f49d5c" opacity="0.5" />

    <!-- Head / Face -->
    <ellipse cx="200" cy="180" rx="55" ry="65" fill="url(#faceGrad)" />

    <!-- Ears -->
    <ellipse cx="143" cy="182" rx="9" ry="14" fill="#fba86c" />
    <ellipse cx="257" cy="182" rx="9" ry="14" fill="#fba86c" />

    <!-- Stylish Hair -->
    <path d="M 140 170 C 138 125, 170 100, 200 100 C 235 100, 262 125, 260 170 C 255 140, 240 128, 215 128 C 180 128, 155 145, 140 170 Z" fill="url(#hairGrad)" />
    <path d="M 150 145 C 170 125, 215 120, 245 135 C 225 130, 180 135, 160 155 Z" fill="#475569" opacity="0.6" />

    <!-- Modern Glasses (Tech / Developer Vibe) -->
    <rect x="156" y="165" width="34" height="24" rx="7" fill="none" stroke="#020617" stroke-width="3.5" />
    <rect x="210" y="165" width="34" height="24" rx="7" fill="none" stroke="#020617" stroke-width="3.5" />
    <line x1="190" y1="175" x2="210" y2="175" stroke="#020617" stroke-width="3.5" />
    <!-- Glass subtle glint -->
    <line x1="160" y1="170" x2="180" y2="182" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <line x1="214" y1="170" x2="234" y2="182" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

    <!-- Eyes (behind glasses) -->
    <circle cx="173" cy="177" r="4" fill="#1e293b" />
    <circle cx="227" cy="177" r="4" fill="#1e293b" />
    <circle cx="175" cy="175" r="1.5" fill="#ffffff" />
    <circle cx="229" cy="175" r="1.5" fill="#ffffff" />

    <!-- Eyebrows -->
    <path d="M 158 158 Q 173 153 188 158" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 212 158 Q 227 153 242 158" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Nose -->
    <path d="M 200 182 L 198 195 L 204 195" stroke="#e08244" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Confident Smile -->
    <path d="M 188 208 Q 200 218 212 208" stroke="#c25e24" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Modern Coding / UI Badge on lapel -->
    <circle cx="255" cy="310" r="12" fill="#0f172a" stroke="#34d399" stroke-width="1.5" />
    <text x="255" y="314" font-family="monospace" font-size="9" font-weight="bold" fill="#34d399" text-anchor="middle">&lt;/&gt;</text>
  </g>
</svg>
